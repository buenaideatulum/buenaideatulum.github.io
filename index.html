<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Califica tu experiencia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      background: #fff;
      color: #222;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    .stars {
      display: flex;
      gap: 1rem;
      font-size: 3rem;
      cursor: pointer;
    }
    .star {
      color: #ccc;
      user-select: none;
      transition: color 0.2s ease;
    }
    .star.selected {
      color: #fbbc04;
    }
  </style>
</head>
<body>
  <h1>¿Cómo fue tu experiencia?</h1>
  <div class="stars">
    <span class="star" data-star="1">★</span>
    <span class="star" data-star="2">★</span>
    <span class="star" data-star="3">★</span>
    <span class="star" data-star="4">★</span>
    <span class="star" data-star="5">★</span>
  </div>

  <script>
    const stars = document.querySelectorAll('.star');
    const token = "8374193660:AAGC1hPrKY1qBNli-QblOssUJf4cHMhNfLc";
    const chat_id = "1917434175";
    const workerURL = "https://weathered-fire-4d18.diegoalvear92.workers.dev/";

    function getDeviceName() {
      const ua = navigator.userAgent;
      if (/iPhone/i.test(ua)) return "iPhone";
      if (/iPad/i.test(ua)) return "iPad";
      if (/Android/i.test(ua)) return "Android";
      if (/Windows/i.test(ua)) return "Windows PC";
      if (/Macintosh/i.test(ua)) return "Mac";
      return "Otro dispositivo";
    }

    function selectStars(count) {
      stars.forEach((star, i) => {
        star.classList.toggle('selected', i < count);
      });
    }

    function sendTelegramMessage(starCount) {
      const device = getDeviceName();
      const icon = starCount <= 3 ? "❌" : "✅";
      const message = `${icon} Nueva calificación:\n⭐ Estrellas: ${starCount}\n📱 Desde: ${device}`;

      return fetch(workerURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id, token, text: message })
      });
    }

    stars.forEach(star => {
      star.addEventListener('click', () => {
        const starCount = Number(star.getAttribute('data-star'));
        selectStars(starCount);

        sendTelegramMessage(starCount)
          .then(res => {
            if (!res.ok) throw new Error('No se pudo enviar el mensaje');
            return res.text();
          })
          .catch(err => console.error('Error enviando a Telegram:', err));

        setTimeout(() => {
          if (starCount <= 3) {
            window.location.href = "https://forms.gle/DCJ1YSbe6h6c8sSx9";
          } else {
            window.location.href = "https://g.page/r/CfMoIh9zqu4UEBM/review";
          }
        }, 500);
      });
    });
  </script>
</body>
</html>
